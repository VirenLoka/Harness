# Muse Glimmer 30B (Meta) on a single H200 (141 GB). Needs vLLM >= 0.29.0.
#
# BF16 weights take ~56 GiB, plus ~5 GiB for the DFlash drafter. Only 13 of the
# 52 layers use full attention (with 2 KV heads); the rest use a 2048-token
# sliding window. KV cache is therefore ~13 KiB per token, so a full 131k-token
# request needs under 2 GiB, and the ~55 GiB left at 0.90 utilization fits
# roughly 30 of them at once.

# Hugging Face repo id or local path.
model: meta-models/Muse-Glimmer-30B

# Passed straight to `vllm serve` (see `vllm serve --help`).
#   key_name: value -> --key-name value
#   true / false    -> --key-name / --no-key-name
#   [a, b]          -> --key-name a b
#   {k: v}          -> --key-name '{"k": "v"}'
#   null            -> omitted
# host, port and api_key are managed by the launcher and must not be set here.
vllm_args:
  served_model_name: muse-glimmer-30b   # the `model` name clients send
  dtype: bfloat16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 131072
  max_num_seqs: 64
  enable_prefix_caching: true
  # Moves the model's reasoning channel into the `reasoning` field on responses.
  reasoning_parser: muse_glimmer
  # Turns the model's ATEM tool-call markup into OpenAI `tool_calls`.
  enable_auto_tool_choice: true
  tool_call_parser: muse_glimmer
  # low | medium | high | xhigh. Requests can override it with
  # "chat_template_kwargs": {"reasoning_strength": "low"}.
  default_chat_template_kwargs:
    reasoning_strength: high
  # Meta's recommended sampling (same as the model's generation_config.json);
  # clients can override per request.
  override_generation_config:
    temperature: 1.0
    top_p: 0.95
    top_k: 64
  # DFlash speculative decoding with Meta's drafter. It drafts 16-token blocks,
  # i.e. 15 speculative tokens per step. It helps most at low concurrency;
  # delete this block to turn it off.
  speculative_config:
    method: dflash
    model: meta-models/Muse-Glimmer-30B-assistant
    num_speculative_tokens: 15
  # Quantization is off by default: BF16 fits comfortably on an H200. Uncomment
  # `quantization` to convert the text decoder to FP8 while loading. Weights
  # shrink from ~56 GiB to ~32 GiB, leaving more room for concurrent requests.
  # The vision encoder and the drafter stay BF16. Schemes that suit this dense
  # model on Hopper:
  #   fp8_per_channel  per-channel weight scales, per-token activation scales
  #                    (same recipe as llm-compressor's FP8_DYNAMIC)
  #   fp8_per_block    128x128-block weight scales, 1x128-block activation scales
  #   fp8_per_tensor   one scale per weight tensor
  # Leave it unset when `model` is already quantized (e.g.
  # RedHatAI/Muse-Glimmer-30B-FP8-block); vLLM reads that from the checkpoint.
  # quantization: fp8_per_channel
  # Optional: keep matching layers in BF16 (regex over vLLM layer names).
  # quantization_config:
  #   ignore: ['re:.*layers\.(0|51)\..*']   # first and last decoder layers
  # FP8 KV cache: uses uncalibrated scales. The sliding-window layers are the
  # most sensitive to that and hold at most 2048 tokens each, so skipping them
  # keeps most of the savings (the 13 full-attention layers hold the rest).
  # kv_cache_dtype: fp8
  # kv_cache_dtype_skip_layers: [sliding_window]
  # The model accepts images (and video frames). The server downloads any
  # image URLs clients send; to restrict which hosts it will fetch from:
  # allowed_media_domains: [upload.wikimedia.org]
  # limit_mm_per_prompt: {image: 8, video: 0}
  # download_dir: /models   # defaults to the Hugging Face cache (HF_HOME)

# Extra environment variables for the vLLM process.
env: {}
  # HF_HOME: /workspace/hf-cache
  # HF_TOKEN comes from your shell environment if you need it.

server:
  host: 0.0.0.0          # gateway bind address (the key is required on every route)
  port: 8000             # gateway port; point ngrok / clients here
  vllm_port: 8001        # vLLM itself, bound to 127.0.0.1 only
  api_key_env: VLLM_API_KEY
  public_paths: [/health]            # exact paths reachable without a key
  allowed_prefixes: [/v1, /health, /version, /tokenize, /detokenize]
  startup_timeout: 3600  # seconds; the first run downloads ~65 GB (model + drafter)
  endpoint_file: run/endpoint.json   # URLs + pid written here once ready (null to disable)

tunnel:
  enabled: false         # or pass --tunnel
  authtoken_env: NGROK_AUTHTOKEN
  domain: null           # reserved ngrok domain, e.g. my-llm.ngrok.app
